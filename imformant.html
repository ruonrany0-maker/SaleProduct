<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imforment</title>
    <link rel="stylesheet" href="imforment.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1 id="btn"> Get in Touch</h1>
        <p id="btn1">Fill out the form below to contact us</p>
        <div class="box">
            <div class="box-text">
                <i class="fa-solid fa-user"></i>
                <input type="text" name="" id="" placeholder="Name">
            </div>
            <div class="box-text">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" name="" id="" placeholder="Email">
            </div>
            <div class="box-text">
                <i class="fa-solid fa-phone"></i>
                <input type="text" name="" id="" placeholder="Phone (optional)">
            </div>
            <div class="box-text">
                <i class="fa-solid fa-pen"></i>
                <input type="text" name="" id="" placeholder="Subject">
            </div>
            <div class="txt">
                <i class="fa-solid fa-book"></i>
                <textarea name="" id="" placeholder="Your Messange"></textarea>
            </div>
            <button>
                Send Messange
            </button>
            <div class="box-footer">
                <div class="txt-left">
                    <ul>
                        <li>
                            <a href="">
                                <i class="fa-solid fa-phone"></i>
                                <span>: 090 979 057</span>
                            </a>
                        </li>
                        <li> 
                            <a href="">
                                <i class="fa-solid fa-envelope"></i>
                                <span>: raanyy123.@gmail.com</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="box-footer"></div>
        </div>
    </div>
</body>
</html>
