<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaleAcessory</title>
    <link rel="stylesheet" href="sign-in.css">
    <link rel="shortcut icon" href="imges/logo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <div class="container background">
        <div class="row">
            <div class="col-12 box">
                <div class="box-login"> 
                    <div class="icon">
                        <i class="fa-solid fa-circle-user"></i>
                        <span>Login</span>
                    </div>
                     <div class="content"> 
                         <div class="email">
                            <label for="">Email :</label>
                            <input type="email" name="" id="" placeholder="www.@gmail.com" required>
                         </div>
                         <div class="password">
                            <label for="">Password :</label>
                            <input type="password" name="" id="" required>
                         </div>
                         <a href="">Forget Password</a>
                         <button style="border-radius: 8px; margin-top: 20px;">Sign In</button>
                     </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
